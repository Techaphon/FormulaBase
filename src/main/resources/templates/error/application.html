<!doctype html>
<html th:lang="${#locale.language}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/app.css?v=20261109-ui-readability" />
    <title th:text="${title == null ? #messages.msg('error.notice') : @uiText.translate(title)}">Application notice</title>
  </head>
  <body class="login-page">
    <main class="login-main">
      <section class="login-card">
        <div class="login-emblem">!</div>
        <h1 th:text="${title == null ? #messages.msg('error.title') : @uiText.translate(title)}">Action could not be completed</h1>
        <p class="error" th:text="${message}"></p>
        <p><a class="btn" th:href="${backUrl}" th:text="#{error.back}">Return to Formula Base</a></p>
      </section>
    </main>
  </body>
</html>
