<!doctype html>
<html lang="en" th:lang="${#locale.language}">
  <head>
    <link rel="stylesheet" href="/css/app.css?v=20261109-ui-readability" />
    <script src="/js/app.js?v=20261030-2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="#{ui.114}">Formula Base Login</title>
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div th:replace="~{fragments/topbar :: topbar}"></div>
      <main class="login-main">
        <section class="login-card">
          <div class="login-emblem">⚗</div>
          <p class="eyebrow">FORMULA BASE MES</p>
          <h1 th:text="#{ui.0}">Welcome back</h1>
          <p class="login-subtitle" th:text="#{ui.1}">
            Sign in to continue to your workspace.
          </p>
          <p
            class="login-error"
            th:if="${error}"
            th:text="${@uiText.translate(error)}"
          ></p>
        <form class="login-form" method="post" action="/login">
          <input type="hidden" name="_csrf" th:value="${csrfToken}" />
            <label
              ><span th:text="#{ui.2}">Username</span
              ><input
                name="username"
                required
                autocomplete="username"
                placeholder="Enter your username"
                th:placeholder="#{ui.9}" /></label
            ><label
              ><span th:text="#{ui.3}">Password</span
              ><span class="password-field"><input
                name="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password"
                th:placeholder="#{ui.10}" /><button class="password-toggle" type="button" onclick="const f=this.previousElementSibling;f.type=f.type==='password'?'text':'password';this.textContent=f.type==='password'?'◉':'◎'" th:aria-label="#{login.togglePassword}">◉</button></span></label
            ><button type="submit" th:text="#{ui.4}">Sign in</button>
          </form>
          <div class="login-demo" th:if="${demoPassword}">
            <strong th:text="#{ui.6}">Demo accounts</strong>CEO: ceo · QC: qc ·
            PC: pc · Worker: worker1<br /><span th:text="#{ui.7}"
              >Password for all:</span
            >
            <code th:text="${demoPassword}"></code>
          </div>
        </section>
      </main>
      <footer class="login-footer" th:text="#{ui.8}">
        Formula Base · Production workflow demo
      </footer>
    </div>
  </body>
</html>
