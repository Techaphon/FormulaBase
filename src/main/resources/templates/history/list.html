<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261031-1"></script><title>Production history</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1>Production history</h1><div class="table-scroll"><table><tr><th>Completed</th><th>Formula</th><th>Target</th><th>Planned</th><th>Actual</th><th>Good</th><th>Rejected</th></tr><tr th:each="record:${records}"><td th:text="${record.completedAt}"></td><td th:text="${record.productionPlan.formula.name}"></td><td th:text="${record.targetQuantity}"></td><td th:text="${record.plannedQuantity}"></td><td th:text="${record.actualProducedQuantity}"></td><td th:text="${record.goodQuantity}"></td><td th:text="${record.rejectedQuantity}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="7">No completed production records.</td></tr></table></div></main></section></div></body></html>
