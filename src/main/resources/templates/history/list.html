<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-3"></script><title th:text="#{history.title}">Production history</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1 th:text="#{history.title}">Production history</h1><div class="table-scroll"><table><tr><th th:text="#{history.completed}">Completed</th><th th:text="#{history.formula}">Formula</th><th th:text="#{history.target}">Target</th><th th:text="#{history.planned}">Planned</th><th th:text="#{history.actual}">Actual</th><th th:text="#{history.good}">Good</th><th th:text="#{history.rejected}">Rejected</th></tr><tr th:each="record:${records}"><td th:text="${record.completedAt}"></td><td th:text="${record.productionPlan.formula.name}"></td><td th:text="${record.targetQuantity}"></td><td th:text="${record.plannedQuantity}"></td><td th:text="${record.actualProducedQuantity}"></td><td th:text="${record.goodQuantity}"></td><td th:text="${record.rejectedQuantity}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="7" th:text="#{history.empty}">No completed production records.</td></tr></table></div></main></section></div></body></html>
