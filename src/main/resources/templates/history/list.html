<!doctype html>
<html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261112-columns"><script src="/js/app.js?v=20261105-history-filters"></script><title th:text="#{history.title}">Production history</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
<header class="fb-page-heading"><div><h1 th:text="#{history.title}">Production history</h1><p class="hint" th:text="#{history.hint}"></p></div></header>
<form method="get" class="library-filters"><label><span th:text="#{common.search}">Search production records</span><input name="keyword" th:value="${keyword}" th:placeholder="#{history.searchPlaceholder}"></label><label><span th:text="#{history.worker}">Worker</span><select name="worker"><option value="" th:text="#{history.allWorkers}">All workers</option><option th:each="person:${workers}" th:value="${person.username}" th:text="${person.fullName}" th:selected="${person.username==selectedWorker}"></option></select></label><label><span th:text="#{history.from}">From</span><input type="date" name="from" th:value="${from}"></label><label><span th:text="#{history.to}">To</span><input type="date" name="to" th:value="${to}"></label><button th:text="#{common.search}">Search</button><a class="table-action" href="/history" th:text="#{common.clear}">Clear</a></form>
<p class="hint" th:text="#{review.resizeHint}"></p><button type="button" id="reset-history-widths" th:text="#{review.resetWidths}"></button><div class="table-scroll"><table id="history-table"><thead><tr><th th:text="#{history.completed}">Completed</th><th th:text="#{print.documentNo}">Document</th><th th:text="#{history.formula}">Formula</th><th th:text="#{planning.worker}">Worker</th><th th:text="#{history.target}">Target</th><th th:text="#{history.lossAllowance}">Loss allowance</th><th th:text="#{history.planned}">Planned</th><th th:text="#{history.actual}">Actual</th><th th:text="#{history.good}">Good</th><th th:text="#{history.rejected}">Rejected</th><th th:text="#{history.surplus}">Surplus</th><th th:text="#{common.status}">Status</th></tr></thead><tbody><tr th:each="record:${records}"><td th:text="${#temporals.format(record.completedAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${record.productionPlan.formula.documentNo}"></td><td th:text="${record.productionPlan.formula.name+' · Rev '+record.productionPlan.formula.revision}"></td><td><span th:text="${record.productionPlan.assignedWorker==null ? #messages.msg('planning.unassigned') : record.productionPlan.assignedWorker.fullName}"></span><details th:if="${transferHistory[record.productionPlan.id] != null}"><summary th:text="#{transfer.history}">Transfer history</summary><ul><li th:each="entry:${transferHistory[record.productionPlan.id]}"><span th:text="${#temporals.format(entry.createdAt,'yyyy-MM-dd HH:mm')}"></span> · <span th:text="${entry.details}"></span> · <span th:text="${entry.actor == null ? '-' : entry.actor.fullName}"></span></li></ul></details></td><td th:text="${record.targetQuantity}"></td><td th:text="${record.lossAllowanceQuantity+' ('+#numbers.formatDecimal(record.lossPercentage,1,2)+'%)'}"></td><td th:text="${record.plannedQuantity}"></td><td th:text="${record.actualProducedQuantity}"></td><td th:text="${record.goodQuantity}"></td><td th:text="${record.rejectedQuantity}"></td><td th:text="${record.surplusQuantity}"></td><td th:text="${#messages.msg('status.'+record.productionPlan.status)}"></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="12" th:text="#{history.empty}">No completed production records.</td></tr></tbody></table></div>
</main></section></div><script defer src="/js/history-columns.js?v=20261112"></script></body></html>
