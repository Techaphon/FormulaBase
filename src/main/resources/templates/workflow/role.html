<!doctype html>
<html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.11}"></title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div>
<header class="fb-page-heading"><div><p class="eyebrow" th:text="${currentUser.role}"></p><h1 th:text="${canManageFormula ? #messages.msg('workspace.qc') : #messages.msg('workspace.pc')}"></h1><p th:text="${currentUser.fullName}"></p></div></header>
<section class="fb-panel" th:if="${canManageFormula}"><h2 th:text="#{workspace.qc.description}"></h2><div class="fb-actions"><a class="fb-action primary" href="/formulas/new" th:text="#{ui.24}"></a><a class="fb-action" href="/formulas" th:text="#{ui.18}"></a><a class="fb-action" href="/materials" th:text="#{ui.20}"></a></div></section>
<section class="fb-panel" th:if="${canPlan}"><h2 th:text="#{workspace.pc.description}"></h2><div class="fb-actions"><a class="fb-action primary" href="/planning" th:text="#{ui.21}"></a><a class="fb-action" href="/formulas" th:text="#{ui.18}"></a></div></section>
<section class="fb-metrics" th:if="${canManageFormula}"><article><span th:text="#{ui.30}"></span><strong th:text="${snapshot.draftFormulas}"></strong></article><article><span th:text="#{ui.32}"></span><strong th:text="${snapshot.pendingFormulaApprovals}"></strong></article><article><a href="/quality" th:text="#{quality.title}"></a><strong th:text="${snapshot.lossExceptions}"></strong></article></section>
<section class="fb-panel" th:if="${canManageFormula}"><h2 th:text="#{ui.41}"></h2><div class="table-scroll"><table><tr><th th:text="#{ui.43}"></th><th th:text="#{ui.65}"></th><th th:text="#{ui.45}"></th></tr><tr th:each="f:${pendingApprovals}"><td th:text="${f.documentNo}"></td><td th:text="${f.name}"></td><td th:text="#{status.PENDING_APPROVAL}"></td></tr><tr th:if="${#lists.isEmpty(pendingApprovals)}"><td colspan="3" th:text="#{ui.116}"></td></tr></table></div></section>
<section class="fb-panel" th:if="${canPlan}"><h2 th:text="#{ui.48}"></h2><div class="table-scroll"><table><tr><th th:text="#{ui.49}"></th><th th:text="#{ui.45}"></th><th th:text="#{ui.56}"></th></tr><tr th:each="c:${draftCycles}"><td th:text="${c.planningMonth}"></td><td th:text="#{status.DRAFT}"></td><td><a class="table-action" th:href="@{'/planning/'+${c.id}}" th:text="#{ui.50}"></a></td></tr><tr th:if="${#lists.isEmpty(draftCycles)}"><td colspan="3" th:text="#{ui.117}"></td></tr></table></div></section>
</section></div></body></html>
