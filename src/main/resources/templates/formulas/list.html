<!doctype html>
<html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.18}">Formulas</title>
</head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
<h1 th:text="#{ui.18}">Formulas</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><p><a th:if="${canManageFormula}" href="/formulas/new" th:text="#{ui.25}">Create formula</a></p>
<div class="table-scroll"><table><thead><tr><th th:text="#{ui.43}">Document</th><th th:text="#{ui.75}">Name</th><th th:text="#{ui.76}">Revision</th><th th:text="#{ui.45}">Status</th><th th:text="#{ui.56}">Action</th></tr></thead><tbody><tr th:each="formula : ${formulas}"><td th:text="${formula.documentNo}"></td><td th:text="${formula.name}"></td><td th:text="${formula.revision}"></td><td th:text="${#messages.msg('status.' + formula.status)}"></td><td><form th:if="${canManageFormula and (formula.status.name() == 'DRAFT' || formula.status.name() == 'REJECTED')}" method="post" th:action="@{'/formulas/' + ${formula.id} + '/submit'}" style="display:inline"><button th:text="#{ui.77}">Submit for CEO approval</button></form> <form th:if="${isCeo and (formula.status.name() == 'DRAFT' || formula.status.name() == 'PENDING_APPROVAL')}" method="post" th:action="@{'/formulas/' + ${formula.id} + '/confirm'}" style="display:inline"><button th:text="#{ui.78}">CEO Confirm</button></form></td></tr><tr th:if="${#lists.isEmpty(formulas)}"><td colspan="5" th:text="#{ui.79}">No formulas yet</td></tr></tbody></table></div>
</main></section></div></body></html>
