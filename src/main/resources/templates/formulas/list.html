<!doctype html>
<html lang="en" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261106-feedback1"><script src="/js/app.js?v=20261105-formula-cards"></script><title th:text="#{formula.listTitle}">Formulas</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="formula-library">
<header class="formula-library-heading"><div><p class="eyebrow" th:text="#{formula.libraryEyebrow}">FORMULA LIBRARY</p><h1 th:text="#{formula.listTitle}">Formulas</h1><p class="hint" th:text="#{formula.listHint}">Each product appears once. Expand its versions to compare and open a revision.</p></div><a class="fb-action" th:if="${canManageFormula}" href="/formulas/new" th:text="#{formula.create}">Create formula</a></header>
<p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
<form class="formula-filters" method="get"><label><span th:text="#{common.search}">Search</span><input name="keyword" th:value="${keyword}" th:placeholder="#{formula.searchPlaceholder}"></label><label><span th:text="#{common.status}">Status</span><select name="status"><option value="" th:text="#{formula.allStatuses}">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${#messages.msg('status.'+s)}" th:selected="${s==selectedStatus}"></option></select></label><button th:text="#{common.search}">Search</button><a class="table-action" href="/formulas" th:text="#{common.clear}">Clear</a></form>
<section class="formula-group-list" th:if="${not #lists.isEmpty(formulaGroups)}" aria-label="Formula list">
<article class="formula-group-card" th:each="group:${formulaGroups}">
  <div class="formula-card-main"><div class="formula-card-info"><p class="formula-document" th:text="${group.documentNo}"></p><h2 th:text="${group.latest.name}"></h2><div class="formula-card-meta"><span class="formula-revision-badge" th:text="${#messages.msg('formula.latestRevision')+' · Rev '+group.latest.revision}"></span><span class="status" th:text="${#messages.msg('status.'+group.latest.status)}"></span></div></div>
  <div class="formula-card-actions"><a class="table-action" th:href="@{'/formulas/'+${group.latest.id}}" th:text="#{common.view}">View</a></div></div>
  <details class="formula-version-disclosure" th:if="${#lists.size(group.versions)>1}"><summary><span th:text="${#messages.msg('formula.versionsCount',#lists.size(group.versions))}">View versions (2)</span><span class="disclosure-chevron" aria-hidden="true">⌄</span></summary><ol class="formula-version-list"><li th:each="version:${group.versions}" th:classappend="${version.id==group.latest.id?'current':''}"><div class="version-number" th:text="${'R'+version.revision}">R1</div><div class="version-information"><strong th:text="${version.documentNo}">DOC-R1</strong><span class="status" th:text="${#messages.msg('status.'+version.status)}"></span></div><a class="table-action" th:href="@{'/formulas/'+${version.id}}" th:text="#{common.view}">View</a></li></ol></details>
</article></section>
<div class="empty formula-empty" th:if="${#lists.isEmpty(formulaGroups)}"><strong th:text="#{formula.noResults}">No formulas found.</strong><p th:text="#{formula.listHint}"></p></div>
</main></section></div></body></html>
