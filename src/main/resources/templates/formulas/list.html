<!doctype html>
<html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-3"></script><title th:text="#{formula.listTitle}">Formulas</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
<h1 th:text="#{formula.listTitle}">Formulas</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
<div class="fb-actions"><a class="fb-action" th:if="${canManageFormula}" href="/formulas/new" th:text="#{formula.create}">Create formula</a></div>
<form method="get"><input name="keyword" th:value="${keyword}" th:placeholder="#{formula.searchPlaceholder}"><select name="status"><option value="" th:text="#{formula.allStatuses}">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${#messages.msg('status.'+s)}" th:selected="${s==selectedStatus}"></option></select><button th:text="#{common.search}">Search</button></form>
<div class="table-scroll"><table><tr><th th:text="#{ui.43}">Document</th><th th:text="#{common.name}">Name</th><th th:text="#{formula.revision}">Revision</th><th th:text="#{common.status}">Status</th><th th:text="#{common.action}">Action</th></tr><tr th:each="formula:${formulas}"><td th:text="${formula.documentNo}"></td><td th:text="${formula.name}"></td><td th:text="${formula.revision}"></td><td th:text="${#messages.msg('status.'+formula.status)}"></td><td><a class="table-action" th:href="@{'/formulas/'+${formula.id}}" th:text="#{common.view}">View</a><form th:if="${canManageFormula and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}" method="post" th:action="@{'/formulas/'+${formula.id}+'/submit'}"><button th:text="#{formula.submit}">Submit</button></form><form th:if="${isCeo and formula.status.name()=='PENDING_APPROVAL'}" method="post" th:action="@{'/formulas/'+${formula.id}+'/confirm'}"><input name="approvalReason" th:placeholder="#{formula.reasonSelfApproval}"><button th:text="#{formula.confirm}">Confirm</button></form><form th:if="${canManageFormula and formula.status.name()=='CONFIRMED'}" method="post" th:action="@{'/formulas/'+${formula.id}+'/revise'}"><button th:text="#{formula.newRevision}">New revision</button></form></td></tr><tr th:if="${#lists.isEmpty(formulas)}"><td colspan="5" th:text="#{formula.noResults}">No formulas found.</td></tr></table></div>
</main></section></div></body></html>
