<!doctype html>
<html th:lang="${#locale.language}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/app.css?v=20261109-ui-readability" />
    <script src="/js/app.js?v=20261109-heuristics"></script>
    <title th:text="#{formula.detailTitle}">Formula detail</title>
  </head>
  <body class="workspace-page">
    <div class="fb-shell">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <section class="fb-content">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main>
          <p><a href="/formulas" th:text="#{formula.back}">← Formulas</a></p>
          <h1 th:text="${formula.documentNo+' · '+formula.name}"></h1>
          <p>
            <span
              class="status"
              th:text="${#messages.msg('status.'+formula.status)}"
            ></span>
            <span
              th:if="${formula.rejectionReason}"
              class="error"
              th:text="${formula.rejectionReason}"
            ></span>
          </p>
          <p
            class="hint"
            th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w · ' + #messages.msg('formula.netWeight') + ' ' + formula.productUnitWeightGrams.stripTrailingZeros().toPlainString() + ' g' : #messages.msg('formula.perUnitLegacy')}"
          ></p>
          <section class="fb-panel" th:if="${#lists.size(formulaVersions)>1}"><h2 th:text="#{formula.revisionHistory}">Formula revisions</h2><nav class="revision-links" th:attr="aria-label=#{formula.revisionHistory}"><a th:each="version:${formulaVersions}" th:href="@{'/formulas/'+${version.id}}" th:classappend="${version.id==formula.id?'active':''}" th:text="${'Rev '+version.revision+' · '+#messages.msg('status.'+version.status)}"></a></nav></section>
          <p
            class="ok"
            th:if="${message}"
            th:text="${@uiText.translate(message)}"
          ></p>
          <p
            class="error"
            th:if="${error}"
            th:text="${@uiText.translate(error)}"
          ></p>
          <div class="fb-actions">
            <a
              class="fb-action"
              th:href="@{'/print/bom/'+${formula.id}}"
              target="_blank"
              th:text="#{formula.printBom}">Print BOM</a
            ><a
              class="fb-action"
              th:if="${canManageFormula and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}"
              th:href="@{'/formulas/'+${formula.id}+'/edit'}"
              th:text="#{formula.editDraft}">Edit draft</a
            >
          </div>
          <form
            th:if="${canManageFormula and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED') and !(isCeo and formula.createdBy!=null and formula.createdBy.id==currentUser.id)}"
            method="post"
            th:action="@{'/formulas/'+${formula.id}+'/submit'}"
          >
            <p class="hint" th:text="#{formula.reviewBeforeSubmit}"></p>
            <button th:text="#{formula.submit}">Submit for CEO approval</button>
          </form>
          <form th:if="${canManageFormula and formula.status.name()=='CONFIRMED'}" method="post" th:action="@{'/formulas/'+${formula.id}+'/revise'}"><button type="submit" th:text="#{formula.newRevision}">Create revision</button></form>
          <section class="fb-panel">
            <h2
              th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? #messages.msg('formula.materialsPercent') : #messages.msg('formula.materialsPerProduct')}"
            >
              Materials
            </h2>
            <table>
              <tr>
                <th th:text="#{formula.material}">Material</th>
                <th th:text="#{formula.phase}">Phase</th>
                <th
                  th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w' : #messages.msg('formula.quantity')}"
                >
                  Qty
                </th>
                <th th:text="#{common.unit}">Unit</th>
              </tr>
              <tr th:each="item:${formula.materials}">
                <td
                  th:text="${item.material.code+' · '+item.material.name}"
                ></td>
                <td th:text="${item.phase+' · '+item.phase.descriptionFor(#locale.language)}"></td>
                <td
                  th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? item.percentage : item.quantityPerUnit}"
                ></td>
                <td
                  th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w' : item.unit}"
                ></td>
              </tr>
            </table>
          </section>
          <section class="fb-panel">
            <h2 th:text="#{formula.instructions}">Production steps</h2>
            <table>
              <tr>
                <th>#</th>
                <th th:text="#{formula.instruction}">Instruction</th>
                <th th:text="#{formula.targetTime}">Target time</th>
                <th th:text="#{formula.temperature}">Temperature</th>
              </tr>
              <tr th:each="step:${formula.steps}">
                <td th:text="${step.stepNumber}"></td>
                <td th:text="${step.instructionFor(#locale.language)}"></td>
                <td
                  th:text="${step.targetSeconds==null?'-':step.targetSeconds / 60 + ' ' + #messages.msg('unit.minute')}"
                ></td>
                <td
                  th:text="${step.requiresTemperature ? (step.temperatureMinC != null and step.temperatureMaxC != null ? step.temperatureMinC + '–' + step.temperatureMaxC + ' °C' : step.temperatureMinC != null ? '≥ ' + step.temperatureMinC + ' °C' : step.temperatureMaxC != null ? '≤ ' + step.temperatureMaxC + ' °C' : #messages.msg('common.notSpecified')) : #messages.msg('common.notRequired')}"
                ></td>
              </tr>
              <tr th:if="${#lists.isEmpty(formula.steps)}">
                <td colspan="4" th:text="#{formula.noSteps}">No steps configured.</td>
              </tr>
            </table>
          </section>
          <section class="fb-panel formula-decision" th:if="${isCeo and formula.status.name()=='PENDING_APPROVAL'}" aria-labelledby="formula-decision-heading">
            <h2 id="formula-decision-heading" th:text="#{formula.decisionHeading}">Formula decision</h2>
            <p class="hint" th:text="#{formula.decisionHint}">Review the formula above, then choose a decision.</p>
            <div class="formula-decision-actions">
              <form method="post" th:action="@{'/formulas/'+${formula.id}+'/confirm'}">
                <label th:if="${formula.createdBy!=null and formula.createdBy.id==currentUser.id}"><span th:text="#{formula.reasonSelfApproval}">Reason for approving your own formula</span><input name="approvalReason" required maxlength="255"></label>
                <button type="submit" th:text="#{formula.confirm}">Approve formula</button>
              </form>
              <form method="post" th:action="@{'/formulas/'+${formula.id}+'/reject'}">
                <label><span th:text="#{formula.rejectionReason}">Reason for not approving</span><input name="reason" required maxlength="255" /></label>
                <button class="formula-reject-button" type="submit" th:text="#{formula.reject}">Do not approve formula</button>
              </form>
            </div>
          </section>
          <form th:if="${isCeo and formula.createdBy!=null and formula.createdBy.id==currentUser.id and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}" method="post" th:action="@{'/formulas/'+${formula.id}+'/confirm-own-draft'}"><label><span th:text="#{formula.reasonSelfApproval}">Reason for approving your own formula</span><input name="approvalReason" required maxlength="255"></label><button type="submit" th:text="#{formula.confirm}">Approve formula</button></form>
          <form
            th:if="${isCeo and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}"
            th:attr="data-confirm=#{formula.confirmDeleteDraft}"
            method="post"
            th:action="@{'/formulas/'+${formula.id}+'/delete'}"
          >
            <button class="danger" th:text="#{formula.deleteDraft}">Delete draft</button>
          </form>
        </main>
      </section>
    </div>
  </body>
</html>
