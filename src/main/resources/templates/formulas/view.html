<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-1"></script><title>Formula detail</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><p><a href="/formulas">← Formulas</a></p><h1 th:text="${formula.documentNo+' · '+formula.name}"></h1><p><span class="status" th:text="${#messages.msg('status.'+formula.status)}"></span> <span th:if="${formula.rejectionReason}" class="error" th:text="${formula.rejectionReason}"></span></p><p class="hint" th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w · Finished product net weight ' + formula.productUnitWeightGrams + ' g / piece' : 'Legacy basis · quantity per product unit'}"></p><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><div class="fb-actions"><a class="fb-action" th:href="@{'/print/bom/'+${formula.id}}" target="_blank">Print BOM</a><a class="fb-action" th:if="${canManageFormula and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}" th:href="@{'/formulas/'+${formula.id}+'/edit'}">Edit draft</a></div><section class="fb-panel"><h2 th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? 'Materials (% w/w)' : 'Materials per product unit'}">Materials</h2><table><tr><th>Material</th><th>Phase</th><th th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w' : 'Qty'}">Qty</th><th>Unit</th></tr><tr th:each="item:${formula.materials}"><td th:text="${item.material.code+' · '+item.material.name}"></td><td th:text="${item.phase+' · '+item.phase.description}"></td><td th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? item.percentage : item.quantityPerUnit}"></td><td th:text="${formula.calculationBasis.name() == 'PERCENT_W_W' ? '% w/w' : item.unit}"></td></tr></table></section><section class="fb-panel"><h2>Production steps</h2><table><tr><th>#</th><th>Instruction</th><th>Target time</th><th>Temperature</th></tr><tr th:each="step:${formula.steps}"><td th:text="${step.stepNumber}"></td><td th:text="${step.instruction}"></td><td th:text="${step.targetSeconds==null?'-':step.targetSeconds / 60 + ' min'}"></td><td th:text="${step.requiresTemperature?'Required':'Not required'}"></td></tr><tr th:if="${#lists.isEmpty(formula.steps)}"><td colspan="4">No steps configured.</td></tr></table></section><form th:if="${isCeo and formula.status.name()=='PENDING_APPROVAL'}" method="post" th:action="@{'/formulas/'+${formula.id}+'/reject'}"><label>Rejection reason <input name="reason" required maxlength="255"></label><button>Reject formula</button></form><form th:if="${isCeo and (formula.status.name()=='DRAFT' or formula.status.name()=='REJECTED')}" method="post" th:action="@{'/formulas/'+${formula.id}+'/delete'}"><button class="danger">Delete draft</button></form></main></section></div></body></html>
