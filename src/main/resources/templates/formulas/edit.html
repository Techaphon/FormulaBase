<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261031-4"></script><title>Edit Formula</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1>Edit draft formula</h1><p class="hint">Existing formulas keep their original basis until you deliberately change it.</p><form method="post" th:action="@{'/formulas/'+${formula.id}+'/edit'}"><label>Document No.<input name="documentNo" th:value="${formula.documentNo}" required></label><label>Formula name<input name="name" th:value="${formula.name}" required></label><section class="fb-panel"><h2>Calculation basis</h2><label>Formula definition<select name="calculationBasis" id="calculationBasis" onchange="syncBasis()"><option value="PERCENT_W_W" th:selected="${formula.calculationBasis.name() == 'PERCENT_W_W'}">% w/w</option><option value="PER_PRODUCT_UNIT" th:selected="${formula.calculationBasis.name() == 'PER_PRODUCT_UNIT'}">Quantity per 1 product unit (legacy)</option></select></label><label>Finished product net weight / piece (g)<input name="productUnitWeightGrams" id="productUnitWeightGrams" type="number" step="0.000001" min="0.000001" th:value="${formula.productUnitWeightGrams}"></label><p class="hint">% w/w must total 100%; it is calculated against planned product pieces × net weight per piece.</p></section><h2 id="materialsTitle">Materials</h2><div th:each="item:${formula.materials}" class="row"><select name="materialIds"><option th:each="m:${materials}" th:value="${m.id}" th:text="${m.code+' · '+m.name}" th:selected="${m.id==item.material.id}"></option></select><select name="materialPhases" required><option th:each="phase:${phases}" th:value="${phase}" th:text="${phase+' · '+phase.description}" th:selected="${phase==item.phase}"></option></select><input class="percent-input" name="percentages" type="number" min="0" max="100" step="0.000001" th:value="${item.percentage}"><input class="quantity-input" name="quantitiesPerUnit" type="number" min="0" step="0.00000001" th:value="${item.quantityPerUnit}"></div><button>Save revision</button></form><script>function syncBasis(){const percent=document.getElementById('calculationBasis').value==='PERCENT_W_W';document.getElementById('productUnitWeightGrams').disabled=!percent;document.getElementById('productUnitWeightGrams').required=percent;document.getElementById('materialsTitle').textContent=percent?'Materials (% w/w)':'Materials per 1 product unit';document.querySelectorAll('.percent-input').forEach(i=>{i.disabled=!percent;i.required=percent;});document.querySelectorAll('.quantity-input').forEach(i=>{i.disabled=percent;i.required=!percent;});}syncBasis();</script></main></section></div></body></html>
