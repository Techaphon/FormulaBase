<!doctype html>
<html th:lang="${#locale.language}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/app.css?v=20261109-ui-readability" />
    <link rel="stylesheet" href="/css/formula-steps.css" />
    <script src="/js/app.js?v=20261031-4"></script>
    <script defer src="/js/formula-summary.js?v=20261108"></script>
    <title th:text="#{formula.editTitle}">Edit Formula</title>
  </head>
  <body class="workspace-page">
    <div class="fb-shell">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <section class="fb-content">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main class="formula-builder">
          <p><a class="back-link" href="/formulas" th:text="#{formula.back}">← Formulas</a></p>
          <header class="fb-page-heading"><div><h1 th:text="#{formula.editTitle}">Edit draft formula</h1><p class="hint" th:text="#{formula.existingBasisHint}"></p></div></header>
          <p id="formula-edit-error" class="error" role="alert" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
          <form method="post" class="formula-edit-form" th:action="@{'/formulas/'+${formula.id}+'/edit'}">
            <label
              ><span th:text="#{formula.documentNo}">Document No.</span><input
                name="documentNo"
                th:value="${formula.documentNo}"
                required /></label
            ><label
              ><span th:text="#{formula.name}">Formula name</span><input
                name="name"
                th:value="${formula.name}"
                required
            /></label>
            <section class="fb-panel">
              <h2 th:text="#{formula.calculationBasis}">Calculation basis</h2>
              <label
                ><span th:text="#{formula.definition}">Formula definition</span><select
                  name="calculationBasis"
                  id="calculationBasis"
                  onchange="syncBasis()"
                >
                  <option
                    value="PERCENT_W_W"
                    th:selected="${formula.calculationBasis.name() == 'PERCENT_W_W'}"
                    th:text="#{formula.percentRecommended}">% w/w</option>
                  <option
                    value="PER_PRODUCT_UNIT"
                    th:selected="${formula.calculationBasis.name() == 'PER_PRODUCT_UNIT'}"
                    th:text="#{formula.perUnitLegacy}">Quantity per 1 product unit (legacy)</option>
                </select></label
              ><label
                ><span th:text="#{formula.netWeight}">Finished product net weight / piece (g)</span><input
                  name="productUnitWeightGrams"
                  id="productUnitWeightGrams"
                  type="number"
                  step="0.000001"
                  min="0.000001"
                  th:value="${formula.productUnitWeightGrams}"
              /></label>
              <p class="hint" id="percentHelp">
                <span th:text="#{formula.percentHelp}">% w/w must total 100%; it is calculated against planned product pieces × net weight per piece.</span>
              </p>
              <p class="hint" id="legacyHelp" hidden th:text="#{formula.legacyHelp}"></p>
            <p id="percentExample" class="hint formula-example" th:text="#{formula.calculationExample}"></p>
            </section>
            <h2 id="materialsTitle" th:text="#{formula.materialsPercent}" th:attr="data-percent-label=#{formula.materialsPercent},data-unit-label=#{formula.materialsPerUnit}">Materials</h2>
            <div id="percentage-summary" class="percentage-summary" aria-live="polite"><strong th:text="#{formula.totalEntered}">Approximate percentage total</strong>: <output id="percentage-total">0</output>%<p class="hint" th:text="#{formula.totalEnteredHint}"></p></div>
<div th:each="item:${formula.materials}" class="row">
              <label class="formula-field"><span th:text="#{formula.selectMaterial}">materialIds</span><select name="materialIds" th:aria-label="#{formula.selectMaterial}">
                <option
                  th:each="m:${materials}"
                  th:value="${m.id}"
                  th:text="${m.code+' · '+m.name}"
                  th:selected="${m.id==item.material.id}"
                ></option></select
              ></label><label class="formula-field"><span th:text="#{formula.phase}">materialPhases</span><select name="materialPhases" required th:aria-label="#{formula.phase}">
                <option
                  th:each="phase:${phases}"
                  th:value="${phase}"
                  th:text="${phase+' · '+phase.descriptionFor(#locale.language)}"
                  th:selected="${phase==item.phase}"
                ></option></select
              ></label><label class="formula-field"><span th:text="#{formula.percentageLabel}">percentages</span><input
                class="percent-input" th:aria-label="#{formula.percentageLabel}"
                name="percentages"
                type="number"
                min="0"
                max="100"
                step="0.000001"
                th:value="${item.percentage}"
              /></label><label class="formula-field"><span th:text="#{formula.quantityLabel}">quantitiesPerUnit</span><input
                class="quantity-input" th:aria-label="#{formula.quantityLabel}"
                name="quantitiesPerUnit"
                type="number"
                min="0"
                step="0.00000001"
                th:value="${item.quantityPerUnit}"
              /></label>
            </div>
            <section class="fb-panel">
              <h2 th:text="#{formula.instructions}">Production steps</h2>
              <p class="hint" th:text="#{formula.stepHelp}"></p>
              <p class="hint" th:text="#{formula.temperatureRule}"></p>
              <div th:each="step:${formula.steps}" class="row step-row">
                <label class="formula-field"><span th:text="#{formula.instructionThai}">stepInstructionsThai</span><input name="stepInstructionsThai" th:aria-label="#{formula.instructionThai}" th:value="${step.instructionFor('th')}" th:placeholder="#{formula.instructionThai}" /></label>
                <label class="formula-field"><span th:text="#{formula.instructionEnglish}">stepInstructionsEnglish</span><input name="stepInstructionsEnglish" th:aria-label="#{formula.instructionEnglish}" th:value="${step.instructionFor('en')}" th:placeholder="#{formula.instructionEnglish}" /></label>
                <label class="formula-field"><span th:text="#{formula.targetMinutes}">stepTargetMinutes</span><input name="stepTargetMinutes" th:aria-label="#{formula.targetMinutes}" type="number" min="1" step="1" th:value="${step.targetSeconds == null ? null : step.targetSeconds / 60}" th:placeholder="#{formula.targetMinutes}" /></label>
                <label class="formula-field"><span th:text="#{formula.temperatureMin}">stepTemperatureMinimums</span><input name="stepTemperatureMinimums" th:aria-label="#{formula.temperatureMin}" type="number" step="0.01" th:value="${step.temperatureMinC}" th:placeholder="#{formula.temperatureMin}" /></label>
                <label class="formula-field"><span th:text="#{formula.temperatureMax}">stepTemperatureMaximums</span><input name="stepTemperatureMaximums" th:aria-label="#{formula.temperatureMax}" type="number" step="0.01" th:value="${step.temperatureMaxC}" th:placeholder="#{formula.temperatureMax}" /></label>
              </div>
              <p class="hint" th:if="${#lists.isEmpty(formula.steps)}" th:text="#{formula.noStepsRevision}">This formula has no production steps.</p>
            </section>
            <label th:if="${formula.previousRevision != null}"><span th:text="#{formula.changeReason}">Reason for revision</span><input name="changeReason" required maxlength="255"></label>
            <button th:text="#{formula.saveRevision}">Save revision</button>
          </form>
          <script>
            function syncBasis() {
              const percent =
                document.getElementById("calculationBasis").value ===
                "PERCENT_W_W";
              document.getElementById("percentHelp").hidden = !percent;
              document.getElementById("legacyHelp").hidden = percent;
              document.getElementById("percentExample").hidden = !percent;
            document.getElementById("productUnitWeightGrams").disabled =
                !percent;
              document.getElementById("productUnitWeightGrams").required =
                percent;
              document.getElementById("productUnitWeightGrams").closest("label").hidden = !percent;
              const title = document.getElementById("materialsTitle");
              title.textContent = percent ? title.dataset.percentLabel : title.dataset.unitLabel;
              document.querySelectorAll(".percent-input").forEach((i) => {
                i.disabled = !percent;
                i.required = percent;
                i.closest(".formula-field").hidden = !percent;
              });
              document.querySelectorAll(".quantity-input").forEach((i) => {
                i.disabled = percent;
                i.required = !percent;
                i.closest(".formula-field").hidden = percent;
              });
            }
            syncBasis();
            (() => {
              const form = document.querySelector('.formula-edit-form');
              const key = 'formula-base-edit:' + form.getAttribute('action');
              try {
                const saved = sessionStorage.getItem(key);
                if (document.getElementById('formula-edit-error') && saved) {
                  const fields = JSON.parse(saved);
                  for (const [name, values] of Object.entries(fields)) {
                    [...form.elements].filter(element => element.name === name).forEach((element, index) => {
                      if (values[index] !== undefined) element.value = values[index];
                    });
                  }
                  syncBasis();
                } else if (!document.getElementById('formula-edit-error')) sessionStorage.removeItem(key);
              } catch (_) { /* Storage is optional. */ }
              form.addEventListener('submit', event => {
                if (event.defaultPrevented) return;
                try {
                  const fields = {};
                  for (const element of form.elements) {
                    if (!element.name || element.name === '_csrf' || element.type === 'submit' || element.type === 'button') continue;
                    (fields[element.name] ||= []).push(element.value);
                  }
                  sessionStorage.setItem(key, JSON.stringify(fields));
                } catch (_) { /* Storage may be unavailable. */ }
              });
            })();
          </script>
        </main>
      </section>
    </div>
  </body>
</html>
