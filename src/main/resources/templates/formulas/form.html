<!doctype html>
<html th:lang="${#locale.language}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/formula-steps.css" />
    <script src="/js/app.js?v=20261101-1"></script>
    <title th:text="#{formula.createTitle}">Create Formula</title>
  </head>
  <body class="workspace-page">
    <div class="fb-shell">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <section class="fb-content">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main>
          <p><a href="/formulas" th:text="#{formula.back}">← Formulas</a></p>
          <h1 th:text="#{formula.createTitle}">Create Formula</h1>
          <p class="hint" th:text="#{formula.percentHelp}"></p>
          <p
            class="error"
            th:if="${error}"
            th:text="${@uiText.translate(error)}"
          ></p>
          <form method="post" action="/formulas" id="formulaForm">
            <label><span th:text="#{formula.documentNo}">Document No.</span><input name="documentNo" required /></label>
            <label><span th:text="#{formula.name}">Formula name</span><input name="name" required /></label>
            <section class="fb-panel">
              <h2 th:text="#{formula.calculationBasis}">Calculation basis</h2>
              <label
                ><span th:text="#{formula.definition}">Formula definition</span><select
                  name="calculationBasis"
                  id="calculationBasis"
                  onchange="syncBasis()"
                >
                  <option value="PERCENT_W_W" th:text="#{formula.percentRecommended}">% w/w (recommended for a formulation)</option>
                  <option value="PER_PRODUCT_UNIT" th:text="#{formula.perUnitLegacy}">Quantity per 1 product unit (legacy)</option>
                </select></label
              >
              <label
                ><span th:text="#{formula.netWeight}">Finished product net weight / piece (g)</span><input
                  name="productUnitWeightGrams"
                  id="productUnitWeightGrams"
                  type="number"
                  step="0.000001"
                  min="0.000001"
                  th:placeholder="#{formula.netWeightPlaceholder}"
              /></label>
              <p class="hint" id="percentHelp" th:text="#{formula.percentHelp}"></p>
              <p class="hint" id="legacyHelp" hidden th:text="#{formula.legacyHelp}"></p>
            </section>
            <h2 id="materialsTitle" th:text="#{formula.materialsPercent}" th:attr="data-percent-label=#{formula.materialsPercent},data-unit-label=#{formula.materialsPerUnit}">Materials (% w/w)</h2>
            <div id="materialRows">
              <div class="row material-row is-new">
                <select name="materialIds" onchange="syncMaterialRow(this)">
                  <option value="" th:text="#{formula.createNewMaterial}">-- New material --</option>
                  <option
                    th:each="material:${materials}"
                    th:value="${material.id}"
                    th:text="${material.code+' · '+material.name+' ('+material.stockUnit+')'}"
                  ></option>
                </select>
                <select
                  name="materialPhases"
                  required
                  th:aria-label="#{formula.phase}"
                >
                  <option
                    th:each="phase:${phases}"
                    th:value="${phase}"
                    th:text="${phase+' · '+phase.descriptionFor(#locale.language)}"
                  ></option>
                </select>
                <div class="new-material-fields">
                  <input name="newMaterialCodes" th:placeholder="#{formula.newMaterialCode}" /><input
                    name="newMaterialNames"
                    th:placeholder="#{formula.newMaterialName}"
                  /><select name="newMaterialUnits">
                    <option value="" th:text="#{common.unit}">Unit</option>
                    <option
                      th:each="unit:${units}"
                      th:value="${unit}"
                      th:text="${unit}"
                    ></option>
                  </select>
                </div>
                <input
                  class="percent-input"
                  name="percentages"
                  type="number"
                  step="0.000001"
                  min="0"
                  max="100"
                  placeholder="% w/w"
                /><input
                  class="quantity-input"
                  name="quantitiesPerUnit"
                  type="number"
                  step="0.00000001"
                  min="0"
                  th:placeholder="#{ui.71}"
                /><button
                  type="button"
                  onclick="removeRow(this, 'material-row')"
                >
                  <span th:text="#{formula.remove}">Remove</span>
                </button>
              </div>
            </div>
            <button type="button" onclick="addMaterial()">
              <span th:text="#{formula.addMaterial}">+ Add material</span>
            </button>
            <h2 th:text="#{formula.instructionsOptional}">Production steps (optional)</h2>
            <p class="hint" th:text="#{formula.stepHelp}"></p>
            <div id="stepRows">
              <div class="row step-row">
                <input
                  name="stepInstructionsThai"
                  th:placeholder="#{formula.instructionThai}"
                /><input
                  name="stepInstructionsEnglish"
                  th:placeholder="#{formula.instructionEnglish}"
                /><input
                  name="stepTargetMinutes"
                  type="number"
                  min="1"
                  step="1"
                  th:placeholder="#{formula.targetMinutes}"
                /><select name="stepRequiresTemperature">
                  <option value="false" th:text="#{formula.temperatureNotRequired}">Temperature not required</option>
                  <option value="true" th:text="#{formula.temperatureRequired}">Temperature required</option></select
                ><input name="stepTemperatureMinimums" type="number" step="0.01" th:placeholder="#{formula.temperatureMin}"
                /><input name="stepTemperatureMaximums" type="number" step="0.01" th:placeholder="#{formula.temperatureMax}"
                ><button type="button" onclick="removeRow(this, 'step-row')">
                  <span th:text="#{formula.remove}">Remove</span>
                </button>
              </div>
            </div>
            <button type="button" onclick="addStep()" th:text="#{formula.addStep}">+ Add step</button
            ><button type="submit" th:text="#{formula.save}">Save Formula</button>
          </form>
        </main>
        <script>
          function removeRow(button, className) {
            if (document.querySelectorAll("." + className).length > 1) {
              button.closest("." + className).remove();
              syncBasis();
            }
          }
          function syncMaterialRow(select) {
            select
              .closest(".material-row")
              .classList.toggle("is-new", !select.value);
          }
          function syncBasis() {
            const percent =
              document.getElementById("calculationBasis").value ===
              "PERCENT_W_W";
            document.getElementById("productUnitWeightGrams").disabled =
              !percent;
            document.getElementById("productUnitWeightGrams").required =
              percent;
            document.getElementById("percentHelp").hidden = !percent;
            document.getElementById("legacyHelp").hidden = percent;
            const title = document.getElementById("materialsTitle");
            title.textContent = percent ? title.dataset.percentLabel : title.dataset.unitLabel;
            document.querySelectorAll(".percent-input").forEach((input) => {
              input.disabled = !percent;
              input.required = percent;
            });
            document.querySelectorAll(".quantity-input").forEach((input) => {
              input.disabled = percent;
              input.required = !percent;
            });
          }
          function addMaterial() {
            const row = document.querySelector(".material-row").cloneNode(true);
            row
              .querySelectorAll("input")
              .forEach((input) => (input.value = ""));
            row
              .querySelectorAll("select")
              .forEach((select) => (select.selectedIndex = 0));
            syncMaterialRow(row.querySelector('[name="materialIds"]'));
            document.getElementById("materialRows").appendChild(row);
            syncBasis();
          }
          document
            .querySelectorAll('[name="materialIds"]')
            .forEach(syncMaterialRow);
          function addStep() {
            const row = document.querySelector(".step-row").cloneNode(true);
            row
              .querySelectorAll("input")
              .forEach((input) => (input.value = ""));
            row
              .querySelectorAll("select")
              .forEach((select) => (select.selectedIndex = 0));
            document.getElementById("stepRows").appendChild(row);
          }
          syncBasis();
        </script>
      </section>
    </div>
  </body>
</html>
