<!doctype html>
<html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.24}">Create Formula</title>
</head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><p><a href="/formulas" th:text="#{ui.19}">← Formulas</a></p><h1 th:text="#{ui.24}">Create Formula</h1><p class="hint" th:text="#{ui.119}">เลือก Material ที่มีอยู่ หรือกรอกข้อมูล Material ใหม่ในแถวเดียวกัน ระบบจะบันทึก Material ใหม่เข้า Material Master อัตโนมัติ</p>
<p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="post" action="/formulas"><label><span th:text="#{ui.64}">Document No.</span> <input name="documentNo" required></label><label><span th:text="#{ui.65}">Formula name</span> <input name="name" required></label><h2 th:text="#{ui.66}">Materials per 1 product unit</h2><div id="rows"><div class="row"><select name="materialIds"><option value="" th:text="#{ui.67}">-- New material --</option><option th:each="material : ${materials}" th:value="${material.id}" th:text="${material.code + ' - ' + material.name + ' (' + material.stockUnit + ')'}"></option></select><input name="newMaterialCodes" placeholder="New code" th:placeholder="#{ui.68}"><input name="newMaterialNames" placeholder="New material name" th:placeholder="#{ui.69}"><select name="newMaterialUnits"><option value="" th:text="#{ui.70}">Unit</option><option th:each="unit : ${units}" th:value="${unit}" th:text="${unit}"></option></select><input name="quantitiesPerUnit" type="number" step="0.00000001" min="0" required placeholder="Qty / unit" th:placeholder="#{ui.71}"><button type="button" onclick="if(document.querySelectorAll('.row').length>1)this.closest('.row').remove()" th:text="#{ui.72}">Remove</button></div></div><button type="button" onclick="addRow()" th:text="#{ui.73}">+ Add material</button><button type="submit" th:text="#{ui.74}">Save Formula</button></form></main>
<script>function addRow(){const r=document.querySelector('.row').cloneNode(true);r.querySelectorAll('input').forEach(i=>i.value='');r.querySelectorAll('select').forEach(s=>s.selectedIndex=0);document.getElementById('rows').appendChild(r)}</script></section></div></body></html>
