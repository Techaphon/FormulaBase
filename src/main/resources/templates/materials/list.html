<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-3"></script><title th:text="#{material.title}">Materials</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1 th:text="#{material.title}">Materials</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="get"><input name="keyword" th:value="${keyword}" th:placeholder="#{material.searchPlaceholder}"><button th:text="#{common.search}">Search</button></form><section th:if="${canManageFormula}"><h2 th:text="#{material.add}">Add material</h2><form method="post"><input name="code" required th:placeholder="#{material.codePlaceholder}"><input name="name" required th:placeholder="#{material.namePlaceholder}"><select name="unit" required><option value="" th:text="#{material.selectUnit}">Select unit</option><option th:each="unit:${units}" th:value="${unit}" th:text="${unit}"></option></select><button th:text="#{material.save}">Save material</button></form></section><div class="table-scroll"><table><tr><th th:text="#{common.code}">Code</th><th th:text="#{common.name}">Name</th><th th:text="#{common.unit}">Unit</th><th th:if="${canManageFormula}" th:text="#{common.action}">Action</th></tr><tr th:each="material:${materials}"><td th:text="${material.code}"></td><td th:text="${material.name}"></td><td th:text="${material.stockUnit}"></td><td th:if="${canManageFormula}"><form method="post" th:action="@{'/materials/'+${material.id}+'/delete'}"><button class="danger" th:text="#{common.delete}">Delete</button></form></td></tr></table></div></main></section></div></body></html>
