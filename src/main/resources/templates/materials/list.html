<!doctype html>
<html th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261107-unslop3"><script src="/js/app.js?v=20261105-material-filter"></script><title th:text="#{material.title}">Materials</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
<header class="fb-page-heading"><div><p class="eyebrow" th:text="#{material.title}">RAW MATERIAL LIBRARY</p><h1 th:text="#{material.title}">Materials</h1><p th:text="#{material.libraryHint}">Use this shared list when building or updating formulas.</p></div><details class="material-add-disclosure" th:if="${canManageFormula}"><summary class="fb-action primary" th:text="#{material.add}">Add material</summary><form method="post" action="/materials/batch" id="materials-batch-form"><div id="materials-batch-rows"><div class="material-batch-row"><label><span th:text="#{common.code}">Code</span><input name="code" required th:placeholder="#{material.codePlaceholder}"></label><label><span th:text="#{common.name}">Material name</span><input name="name" required th:placeholder="#{material.namePlaceholder}"></label><label><span th:text="#{common.unit}">Unit</span><select name="unit" required><option value="" th:text="#{material.selectUnit}">Select unit</option><option th:each="unit:${units}" th:value="${unit}" th:text="${unit}"></option></select></label></div></div><button type="button" id="add-material-row" th:text="#{material.add}">Add material</button><button type="submit" th:text="#{material.save}">Save material</button></form></details></header>
<p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
<form method="get" class="library-filters"><label><span th:text="#{common.search}">Search materials</span><input name="keyword" th:value="${keyword}" th:placeholder="#{material.searchPlaceholder}"></label><label><span th:text="#{common.unit}">Unit</span><select name="unit"><option value="" th:text="#{material.allUnits}">All units</option><option th:each="unit:${units}" th:value="${unit}" th:text="${unit}" th:selected="${unit==selectedUnit}"></option></select></label><button th:text="#{common.search}">Search</button><a class="table-action" href="/materials" th:text="#{common.clear}">Clear</a></form>
<div class="table-scroll"><table><thead><tr><th th:text="#{common.code}">Code</th><th th:text="#{common.name}">Name</th><th th:text="#{common.unit}">Unit</th><th th:if="${canManageFormula}" th:text="#{common.action}">Action</th></tr></thead><tbody><tr th:each="material:${materials}"><td th:text="${material.code}"></td><td th:text="${material.name}"></td><td th:text="${material.stockUnit}"></td><td th:if="${canManageFormula}"><form th:if="${!usedMaterialIds.contains(material.id)}" method="post" th:action="@{'/materials/'+${material.id}+'/delete'}"><button class="danger" th:text="#{common.delete}">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(materials)}"><td colspan="4" th:text="#{material.noResults}">No materials match the selected filters.</td></tr></tbody></table></div>
</main></section></div><script>document.getElementById('add-material-row')?.addEventListener('click',function(){const rows=document.getElementById('materials-batch-rows');const row=rows.firstElementChild.cloneNode(true);row.querySelectorAll('input').forEach(input=>input.value='');row.querySelectorAll('select').forEach(select=>select.selectedIndex=0);const remove=document.createElement('button');remove.type='button';remove.textContent=document.documentElement.lang==='th'?'ลบรายการ':'Remove';remove.addEventListener('click',()=>row.remove());row.appendChild(remove);rows.appendChild(row);});</script></body></html>
