<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261031-1"></script><title>Materials</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1>Materials</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="get"><input name="keyword" th:value="${keyword}" placeholder="Search code or name"><button>Search</button></form><section th:if="${canManageFormula}"><h2>Add material</h2><form method="post"><input name="code" required placeholder="Code e.g. RM-001"><input name="name" required placeholder="Material name"><select name="unit" required><option value="">Select unit</option><option th:each="unit:${units}" th:value="${unit}" th:text="${unit}"></option></select><button>Save material</button></form></section><div class="table-scroll"><table><tr><th>Code</th><th>Name</th><th>Unit</th><th th:if="${canManageFormula}">Action</th></tr><tr th:each="material:${materials}"><td th:text="${material.code}"></td><td th:text="${material.name}"></td><td th:text="${material.stockUnit}"></td><td th:if="${canManageFormula}"><form method="post" th:action="@{'/materials/'+${material.id}+'/delete'}"><button class="danger">Delete</button></form></td></tr></table></div></main></section></div></body></html>
