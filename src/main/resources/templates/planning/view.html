<!doctype html>
<html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.92}">Planning Cycle</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><p><a href="/planning" th:text="#{ui.22}">← Monthly Planning</a></p><h1 th:text="${#messages.msg('ui.21') + ' ' + cycle.planningMonth}"></h1><p><span th:text="#{ui.45}"></span>: <strong th:text="${#messages.msg('status.' + cycle.status)}"></strong></p><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
<form method="post" th:if="${cycle.status.name() == 'DRAFT' or isCeo}" th:action="@{'/planning/' + ${cycle.id} + '/plans'}"><select name="formulaId" required><option value="" th:text="#{ui.93}">Select confirmed formula</option><option th:each="formula : ${formulas}" th:if="${formula.status.name() == 'CONFIRMED'}" th:value="${formula.id}" th:text="${formula.documentNo + ' - ' + formula.name}"></option></select><select name="workerId"><option value="" th:text="#{ui.94}">Unassigned</option><option th:each="worker : ${workers}" th:value="${worker.id}" th:text="${worker.fullName}"></option></select><input name="plannedDate" type="date" required><input name="targetQuantity" type="number" min="1" required placeholder="Target units" th:placeholder="#{ui.95}"><button th:text="#{ui.96}">Add task</button></form>
<form method="post" th:if="${cycle.status.name() == 'DRAFT'}" th:action="@{'/planning/' + ${cycle.id} + '/lock'}"><button th:text="#{ui.97}">Lock monthly plan</button></form>
<div class="table-scroll"><table><thead><tr><th th:text="#{ui.54}">Date</th><th th:text="#{ui.44}">Formula</th><th th:text="#{ui.98}">Worker</th><th th:text="#{ui.55}">Target</th><th th:text="#{ui.45}">Status</th></tr></thead><tbody><tr th:each="plan : ${plans}"><td th:text="${plan.plannedDate}"></td><td th:text="${plan.formula.name}"></td><td th:text="${plan.assignedWorker != null ? plan.assignedWorker.fullName : 'Unassigned'}"></td><td th:text="${plan.targetQuantity}"></td><td th:text="${(plan.qualityReviewedAt != null ? #messages.msg('quality.saved') : #messages.msg('status.' + plan.status))}"></td></tr><tr th:if="${#lists.isEmpty(plans)}"><td colspan="5" th:text="#{ui.99}">No production tasks yet</td></tr></tbody></table></div></main></section></div></body></html>
