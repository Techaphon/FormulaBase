<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261031-5"></script><title>Planning Cycle</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><p><a href="/planning">← Monthly Planning</a></p><h1 th:text="${'Monthly Planning '+cycle.planningMonth}"></h1><p>Status: <strong th:text="${#messages.msg('status.'+cycle.status)}"></strong></p><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form th:if="${cycle.status.name()=='DRAFT' or isCeo}" method="post" th:action="@{'/planning/'+${cycle.id}+'/plans'}"><select name="formulaId" required><option value="">Select confirmed formula</option><option th:each="formula:${formulas}" th:if="${formula.status.name()=='CONFIRMED'}" th:value="${formula.id}" th:text="${formula.documentNo+' · '+formula.name+' · Rev '+formula.revision}"></option></select><select name="workerId"><option value="">Unassigned</option><option th:each="worker:${workers}" th:value="${worker.id}" th:text="${worker.fullName}"></option></select><input type="date" name="plannedDate" required><input type="number" name="targetQuantity" min="1" placeholder="Target units" required><button>Add task</button></form><form th:if="${cycle.status.name()=='DRAFT'}" method="post" th:action="@{'/planning/'+${cycle.id}+'/lock'}"><button>Lock monthly plan</button></form><div class="table-scroll"><table><thead><tr><th>Date</th><th>Formula</th><th>Worker</th><th>Target</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="plan:${plans}"><td th:text="${plan.plannedDate}"></td><td th:text="${plan.formula.name+' · Rev '+plan.formula.revision}"></td><td th:text="${plan.assignedWorker==null?'Unassigned':plan.assignedWorker.fullName}"></td><td th:text="${plan.targetQuantity}"></td><td th:text="${plan.qualityReviewedAt!=null?#messages.msg('quality.saved'):#messages.msg('status.'+plan.status)}"></td><td><a class="table-action" target="_blank" th:href="@{'/print/work-order/'+${plan.id}}">Print</a><details th:if="${(cycle.status.name()=='DRAFT' or isCeo) and plan.status.name()=='PLANNED'}"><summary>Change</summary><p class="hint">Rescheduling closes at 23:59:59 on the day before production.</p><form method="post" th:action="@{'/planning/plans/'+${plan.id}+'/reschedule'}"><input name="plannedDate" type="date" required><select name="workerId"><option value="">Keep worker</option><option th:each="worker:${workers}" th:value="${worker.id}" th:text="${worker.fullName}"></option></select><input name="reason" placeholder="Reason" required><button>Reschedule</button></form><form method="post" th:action="@{'/planning/plans/'+${plan.id}+'/cancel'}"><button class="danger">Cancel</button></form></details><details th:if="${not #lists.isEmpty(plan.rescheduleLogs)}"><summary>History</summary><p th:each="log:${plan.rescheduleLogs}" th:text="${log.previousDate+' → '+log.newDate+' · '+log.reason}"></p></details></td></tr><tr th:if="${#lists.isEmpty(plans)}"><td colspan="6">No production tasks yet.</td></tr></tbody></table></div></main></section></div></body></html>
