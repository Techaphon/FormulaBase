<!doctype html>
<html th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-3"></script>
  <title th:text="#{planning.cycleTitle}">Planning Cycle</title>
</head>
<body class="workspace-page"><div class="fb-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
  <section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
    <p><a href="/planning" th:text="#{planning.back}">← Monthly Planning</a></p>
    <h1 th:text="${#messages.msg('planning.title')+' '+cycle.planningMonth}">Monthly Planning</h1>
    <p><span th:text="#{common.status}">Status</span>: <strong th:text="${#messages.msg('status.'+cycle.status)}"></strong></p>
    <p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p>
    <p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
    <form th:if="${cycle.status.name()=='DRAFT' or isCeo}" method="post" th:action="@{'/planning/'+${cycle.id}+'/plans'}">
      <select name="formulaId" required><option value="" th:text="#{planning.selectFormula}">Select confirmed formula</option><option th:each="formula:${formulas}" th:if="${formula.status.name()=='CONFIRMED'}" th:value="${formula.id}" th:text="${formula.documentNo+' · '+formula.name+' · Rev '+formula.revision}"></option></select>
      <select name="workerId"><option value="" th:text="#{planning.unassigned}">Unassigned</option><option th:each="worker:${workers}" th:value="${worker.id}" th:text="${worker.fullName}"></option></select>
      <input type="date" name="plannedDate" required><input type="number" name="targetQuantity" min="1" th:placeholder="#{planning.targetUnits}" required><button th:text="#{planning.addTask}">Add task</button>
    </form>
    <form th:if="${cycle.status.name()=='DRAFT'}" method="post" th:action="@{'/planning/'+${cycle.id}+'/lock'}"><button th:text="#{planning.lock}">Lock monthly plan</button></form>
    <div class="table-scroll"><table><thead><tr><th th:text="#{common.date}">Date</th><th th:text="#{ui.44}">Formula</th><th th:text="#{planning.worker}">Worker</th><th th:text="#{ui.55}">Target</th><th th:text="#{common.status}">Status</th><th th:text="#{common.action}">Actions</th></tr></thead><tbody>
      <tr th:each="plan:${plans}"><td th:text="${plan.plannedDate}"></td><td th:text="${plan.formula.name+' · Rev '+plan.formula.revision}"></td><td th:text="${plan.assignedWorker==null?#messages.msg('planning.unassigned'):plan.assignedWorker.fullName}"></td><td th:text="${plan.targetQuantity}"></td><td th:text="${plan.qualityReviewedAt!=null?#messages.msg('quality.saved'):#messages.msg('status.'+plan.status)}"></td><td>
        <a class="table-action" target="_blank" th:href="@{'/print/work-order/'+${plan.id}}" th:text="#{common.print}">Print</a>
        <details th:if="${(cycle.status.name()=='DRAFT' or isCeo) and plan.status.name()=='PLANNED'}"><summary th:text="#{planning.change}">Change</summary><p class="hint" th:text="#{planning.rescheduleHint}"></p><form method="post" th:action="@{'/planning/plans/'+${plan.id}+'/reschedule'}"><input name="plannedDate" type="date" required><select name="workerId"><option value="" th:text="#{planning.keepWorker}">Keep worker</option><option th:each="worker:${workers}" th:value="${worker.id}" th:text="${worker.fullName}"></option></select><input name="reason" th:placeholder="#{common.reason}" required><button th:text="#{planning.reschedule}">Reschedule</button></form><form method="post" th:action="@{'/planning/plans/'+${plan.id}+'/cancel'}"><button class="danger" th:text="#{planning.cancel}">Cancel</button></form></details>
        <details th:if="${not #lists.isEmpty(plan.rescheduleLogs)}"><summary th:text="#{planning.history}">History</summary><p th:each="log:${plan.rescheduleLogs}" th:text="${log.previousDate+' → '+log.newDate+' · '+log.reason}"></p></details>
      </td></tr>
      <tr th:if="${#lists.isEmpty(plans)}"><td colspan="6" th:text="#{planning.noTasks}">No production tasks yet.</td></tr>
    </tbody></table></div>
  </main></section>
</div></body></html>
