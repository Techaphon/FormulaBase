<!doctype html>
<html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.21}">Monthly Planning</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1 th:text="#{ui.21}">Monthly Planning</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="post" action="/planning"><input name="planningMonth" type="month" required><button th:text="#{ui.89}">Create month</button></form><div class="table-scroll"><table><thead><tr><th th:text="#{ui.90}">Month</th><th th:text="#{ui.45}">Status</th><th></th></tr></thead><tbody><tr th:each="cycle : ${cycles}"><td th:text="${cycle.planningMonth}"></td><td th:text="${#messages.msg('status.' + cycle.status)}"></td><td><a th:href="@{'/planning/' + ${cycle.id}}" th:text="#{ui.91}">Open</a></td></tr></tbody></table></div></main></section></div></body></html>
