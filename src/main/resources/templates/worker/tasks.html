<!doctype html>
<html lang="en" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261109-review-fixes"><script src="/js/app.js?v=20261109-review-fixes"></script><title th:text="#{ui.23}">Worker Tasks</title></head>
<body class="worker-page"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="wrap"><h1 th:text="#{ui.100}">My tasks</h1><p id="worker-today-label" th:attr="data-today=${today.toString()}" th:text="${#messages.msg('ui.17') + ': ' + today}"></p>
<label class="worker-task-search"><span th:text="#{worker.searchTasks}">Find a task</span><input id="worker-task-search" type="search" th:placeholder="#{worker.searchPlaceholder}"></label>
<div class="worker-filters" role="group" th:aria-label="#{worker.filterTasks}"><button type="button" class="active" data-task-filter="all" th:text="#{worker.filterAll}"></button><button type="button" data-task-filter="today" th:text="#{worker.filterToday}"></button><button type="button" data-task-filter="overdue" th:text="#{worker.filterOverdue}"></button></div>
<h2 class="worker-group-heading" th:if="${not #lists.isEmpty(tasks)}" th:text="#{worker.activeGroup}"></h2><section class="card worker-task-card" th:each="task : ${tasks}" th:attr="data-task-date=${task.plannedDate},data-task-status=${task.status},data-review-label=#{worker.reviewGroup},data-other-label=#{worker.otherGroup}"><span class="status danger" th:if="${task.plannedDate.isBefore(today) and (task.status.name()=='PLANNED' or task.status.name()=='IN_PROGRESS')}" th:text="#{worker.overdueTask}"></span><strong th:text="${task.formula.name}"></strong><p th:text="${task.formula.documentNo+' · Rev '+task.formula.revision}"></p><p th:text="${#messages.msg('ui.54') + ': ' + task.plannedDate + ' | ' + #messages.msg('ui.55') + ': ' + task.targetQuantity + ' ' + #messages.msg('unit.piece')}"></p><p th:text="${#messages.msg('ui.45') + ': ' + (task.qualityReviewedAt != null ? #messages.msg('quality.saved') : #messages.msg('status.' + task.status))}"></p><a class="btn" th:href="@{'/worker/plans/' + ${task.id}}" th:text="#{ui.101}">Open batch</a></section>
<p class="empty worker-empty" th:if="${#lists.isEmpty(tasks)}" th:text="#{ui.102}">No assigned tasks.</p><p id="worker-filter-empty" class="empty worker-empty" hidden role="status" th:text="#{worker.noMatchingTasks}">No tasks match the search or filter.</p></main>
<script>(function(){const cards=[...document.querySelectorAll('.worker-task-card')];let lastGroup='active';cards.forEach(card=>{const status=card.dataset.taskStatus;const group=status==='LOSS_EXCEPTION'?'review':(status==='PLANNED'||status==='IN_PROGRESS')?'active':'other';if(group!==lastGroup){const heading=document.createElement('h2');heading.className='worker-group-heading';heading.dataset.group=group;heading.textContent=group==='review'?card.dataset.reviewLabel:card.dataset.otherLabel;card.before(heading);lastGroup=group;}card.dataset.group=group;});let selected='all';const search=document.getElementById('worker-task-search');const empty=document.getElementById('worker-filter-empty');function refresh(){const today=document.getElementById('worker-today-label').dataset.today;const query=search.value.trim().toLocaleLowerCase();let visible=0;cards.forEach(card=>{const date=card.dataset.taskDate;const periodMatch=selected==='today'?date===today:selected==='overdue'?(date<today && (card.dataset.taskStatus==='PLANNED'||card.dataset.taskStatus==='IN_PROGRESS')):true;card.hidden=!(periodMatch&&card.textContent.toLocaleLowerCase().includes(query));if(!card.hidden)visible++;});document.querySelectorAll('.worker-group-heading').forEach(heading=>{const group=heading.dataset.group||'active';heading.hidden=!cards.some(card=>card.dataset.group===group&&!card.hidden);});empty.hidden=cards.length===0||visible>0;}document.querySelectorAll('[data-task-filter]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.taskFilter;document.querySelectorAll('[data-task-filter]').forEach(item=>{item.classList.toggle('active',item===button);item.setAttribute('aria-pressed',String(item===button));});refresh();}));document.querySelectorAll('[data-task-filter]').forEach(item=>item.setAttribute('aria-pressed',String(item.classList.contains('active'))));search.addEventListener('input',refresh);})();</script></body></html>
