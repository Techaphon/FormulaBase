<!doctype html><html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.23}">Worker Tasks</title></head><body class="worker-page"><div th:replace="~{fragments/topbar :: topbar}"></div><div class="wrap"><h1 th:text="#{ui.100}">My Tasks</h1><p th:text="${(#messages.msg('ui.17') + ': ') + today}"></p><div class="card" th:each="task : ${tasks}"><strong th:text="${task.formula.name}"></strong><p th:text="${#messages.msg('ui.54') + ': ' + task.plannedDate + ' | ' + #messages.msg('ui.55') + ': ' + task.targetQuantity + ' ' + #messages.msg('unit.piece')}"></p><p th:text="${#messages.msg('ui.45') + ': ' + (task.qualityReviewedAt != null ? #messages.msg('quality.saved') : #messages.msg('status.' + task.status))}"></p><a class="btn" th:href="@{'/worker/plans/' + ${task.id}}" th:text="#{ui.101}">Open Batch</a></div><p th:if="${#lists.isEmpty(tasks)}" th:text="#{ui.102}">No assigned tasks for today.</p></div></body></html>
