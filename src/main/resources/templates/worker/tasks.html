<!doctype html>
<html lang="en" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261107-unslop3"><script src="/js/app.js?v=20261105-worker-tasks"></script><title th:text="#{ui.23}">Worker Tasks</title></head>
<body class="worker-page"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="wrap"><h1 th:text="#{ui.100}">My tasks</h1><p id="worker-today-label" th:text="${#messages.msg('ui.17') + ': ' + today}"></p>
<label class="worker-task-search"><span th:text="#{worker.searchTasks}">Find a task</span><input id="worker-task-search" type="search" th:placeholder="#{worker.searchPlaceholder}"></label>
<div class="worker-filters" role="group" th:aria-label="#{worker.filterTasks}"><button type="button" class="active" data-task-filter="all" th:text="#{worker.filterAll}"></button><button type="button" data-task-filter="today" th:text="#{worker.filterToday}"></button><button type="button" data-task-filter="overdue" th:text="#{worker.filterOverdue}"></button></div>
<section class="card worker-task-card" th:each="task : ${tasks}" th:attr="data-task-date=${task.plannedDate},data-task-status=${task.status}"><strong th:text="${task.formula.name}"></strong><p th:text="${task.formula.documentNo+' · Rev '+task.formula.revision}"></p><p th:text="${#messages.msg('ui.54') + ': ' + task.plannedDate + ' | ' + #messages.msg('ui.55') + ': ' + task.targetQuantity + ' ' + #messages.msg('unit.piece')}"></p><p th:text="${#messages.msg('ui.45') + ': ' + (task.qualityReviewedAt != null ? #messages.msg('quality.saved') : #messages.msg('status.' + task.status))}"></p><a class="btn" th:href="@{'/worker/plans/' + ${task.id}}" th:text="#{ui.101}">Open batch</a></section>
<p class="empty worker-empty" th:if="${#lists.isEmpty(tasks)}" th:text="#{ui.102}">No assigned tasks.</p></main>
<script>(function(){const cards=[...document.querySelectorAll('.worker-task-card')];let selected='all';const search=document.getElementById('worker-task-search');function refresh(){const today=document.getElementById('worker-today-label').textContent.split(': ').pop();const query=search.value.trim().toLocaleLowerCase();cards.forEach(card=>{const date=card.dataset.taskDate;const periodMatch=selected==='today'?date===today:selected==='overdue'?date<today:true;card.hidden=!(periodMatch&&card.textContent.toLocaleLowerCase().includes(query));});}document.querySelectorAll('[data-task-filter]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.taskFilter;document.querySelectorAll('[data-task-filter]').forEach(item=>item.classList.toggle('active',item===button));refresh();}));search.addEventListener('input',refresh);})();</script></body></html>
