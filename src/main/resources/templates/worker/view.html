<!doctype html><html lang="en" th:lang="${#locale.language}"><head><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261030-2"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{ui.103}">Batch Execution</title></head><body class="worker-page"><div th:replace="~{fragments/topbar :: topbar}"></div><div class="wrap"><p><a href="/worker/tasks" th:text="#{ui.104}">← My tasks</a></p><div class="card"><h1 th:text="${plan.formula.name}"></h1><div class="metric"><span th:text="#{ui.55}">Target</span><strong th:text="${plan.targetQuantity + ' ' + #messages.msg('unit.piece')}"></strong></div><div class="metric" th:if="${plan.plannedQuantity != null}"><span th:text="#{ui.105}">Planned</span><strong th:text="${plan.plannedQuantity + ' ' + #messages.msg('unit.piece')}"></strong></div><div class="metric"><span th:text="#{ui.45}">Status</span><strong th:text="${plan.qualityReviewedAt != null ? #messages.msg('quality.saved') : #messages.msg('status.' + plan.status)}"></strong></div><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="post" th:if="${plan.status.name() == 'PLANNED'}" th:action="@{'/worker/plans/' + ${plan.id} + '/start'}"><label><span th:text="#{ui.106}">Loss percentage (%)</span><input name="lossPercentage" type="number" step="0.01" min="0" max="100" required></label><button th:text="#{ui.107}">Start entire batch</button></form><section><h2 th:text="#{batch.materials}"></h2><p class="hint" th:text="${plan.plannedQuantity == null ? #messages.msg('batch.materialPreview') : #messages.msg('batch.materialFinal')}"></p><div class="metric" th:each="item:${materials}"><span th:text="${item.name}"></span><strong th:text="${#numbers.formatDecimal(item.total,1,3) + ' ' + item.unit}"></strong></div></section><form method="post" id="complete-batch" th:attr="data-target=${plan.targetQuantity},data-allowance=${plan.lossAllowanceQuantity},data-warning=#{batch.confirmException}" th:if="${plan.status.name() == 'IN_PROGRESS'}" th:action="@{'/worker/plans/' + ${plan.id} + '/complete'}"><p class="hint" th:text="#{batch.actualHint}"></p><label><span th:text="#{ui.108}">Actual produced units</span><input name="actualProduced" type="number" min="0" required></label><label><span th:text="#{ui.109}">Rejected/lost units</span><input name="rejected" type="number" min="0" required></label><button th:text="#{ui.110}">Complete batch</button></form><div th:if="${plan.status.name() == 'COMPLETED' or plan.status.name() == 'LOSS_EXCEPTION'}"><p th:text="${(#messages.msg('output.good') + ': ') + plan.goodQuantity + ' ' + #messages.msg('unit.piece')}"></p><p th:text="${(#messages.msg('output.rejected') + ': ') + plan.rejectedQuantity + ' ' + #messages.msg('unit.piece')}"></p><p th:text="${(#messages.msg('output.surplus') + ': ') + plan.surplusQuantity + ' ' + #messages.msg('unit.piece')}"></p></div></div></div></body></html>
