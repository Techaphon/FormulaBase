<!doctype html>
<div th:fragment="topbar" class="fb-topbar">
    <script defer src="/js/csrf.js?v=20261031-1"></script>
    <style>
        .fb-topbar-actions {
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem;
        }
        .fb-topbar-actions form.topbar-logout {
            margin: 0 !important;
            padding: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
        }
        .fb-topbar-actions form.topbar-logout button.fb-logout-button {
            margin: 0 !important;
            height: 38px;
            padding: 0 14px;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 1 !important;
        }

        /* ซ่อนปุ่ม Logout ด้านบนอัตโนมัติ ในหน้าที่มีแถบเมนูด้านซ้าย (Sidebar) หรือมีปุ่ม Logout มุมซ้ายล่างอยู่แล้ว */
        body:has(aside) .topbar-logout,
        body:has([class*="sidebar"]) .topbar-logout,
        body:has(form[action="/logout"]:not(.topbar-logout)) .topbar-logout,
        body:has(a[href="/logout"]) .topbar-logout {
            display: none !important;
        }
    </style>
    <div class="fb-topbar-title">
        <span class="fb-brand-mark" aria-hidden="true" th:text="${currentUser == null ? 'F' : #strings.substring(currentUser.fullName,0,1)}">F</span>
        <span>
            <strong th:text="${currentUser == null ? 'Formula Base' : currentUser.fullName}">Formula Base</strong>
            <small th:if="${currentUser != null}" th:text="${#messages.msg('role.'+currentUser.role)}"></small>
        </span>
    </div>
    <div class="fb-topbar-actions" aria-label="Display preferences" th:aria-label="#{ui.113}">
        <form th:if="${session.FORMULA_BASE_USERNAME != null}" method="post" action="/logout" class="topbar-logout">
            <button type="submit" class="fb-logout-button" th:text="#{ui.5}">Logout</button>
        </form>
        <div class="fb-language" role="group" aria-label="Language" th:aria-label="#{ui.111}">
            <button type="button" data-lang="th" onclick="fbSetLanguage('th')">TH</button>
            <button type="button" data-lang="en" onclick="fbSetLanguage('en')">EN</button>
        </div>
        <button type="button" class="fb-icon-button" id="fb-theme-toggle" onclick="fbToggleTheme()" title="Toggle theme" th:title="#{ui.112}" aria-label="Toggle theme" th:aria-label="#{ui.112}">☾</button>
    </div>
</div>
