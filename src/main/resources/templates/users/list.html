<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261031-1"></script><title>User management</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1>User management</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="post"><label>Username<input name="username" required></label><label>Full name<input name="fullName" required></label><label>Password<input name="password" type="password" required></label><label>Role<select name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${role}"></option></select></label><button>Create user</button></form><div class="table-scroll"><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th>Action</th></tr><tr th:each="user:${users}"><td th:text="${user.username}"></td><td th:text="${user.fullName}"></td><td th:text="${user.role}"></td><td th:text="${user.active?'Active':'Inactive'}"></td><td><form method="post" th:action="@{'/users/'+${user.id}+'/toggle'}"><button th:text="${user.active?'Deactivate':'Activate'}"></button></form></td></tr></table></div></main></section></div></body></html>
