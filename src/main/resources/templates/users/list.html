<!doctype html><html th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js?v=20261101-3"></script><title th:text="#{user.title}">User management</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main><h1 th:text="#{user.title}">User management</h1><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><form method="post"><label><span th:text="#{user.username}">Username</span><input name="username" required></label><label><span th:text="#{user.fullName}">Full name</span><input name="fullName" required></label><label><span th:text="#{user.password}">Password</span><input name="password" type="password" required></label><label><span th:text="#{user.role}">Role</span><select name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${role}"></option></select></label><button th:text="#{user.create}">Create user</button></form><div class="table-scroll"><table><tr><th th:text="#{user.username}">Username</th><th th:text="#{common.name}">Name</th><th th:text="#{user.role}">Role</th><th th:text="#{common.status}">Status</th><th th:text="#{common.action}">Action</th></tr><tr th:each="user:${users}"><td th:text="${user.username}"></td><td th:text="${user.fullName}"></td><td th:text="${user.role}"></td><td th:text="${user.active?#messages.msg('common.active'):#messages.msg('common.inactive')}"></td><td><form method="post" th:action="@{'/users/'+${user.id}+'/toggle'}"><button th:text="${user.active?#messages.msg('user.deactivate'):#messages.msg('user.activate')}"></button></form></td></tr></table></div></main></section></div></body></html>
