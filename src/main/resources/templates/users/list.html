<!doctype html><html lang="en" th:lang="${#locale.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261107-unslop3"><script src="/js/app.js?v=20261105-ui"></script><title th:text="#{user.title}">User management</title></head><body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main class="user-management"><header class="fb-page-heading"><div><p class="eyebrow" th:text="#{nav.administration}">ADMINISTRATION</p><h1 th:text="#{user.title}">User management</h1><p class="hint" th:text="#{user.pageHint}">Create team accounts and control access by role.</p></div></header><p class="ok" th:if="${message}" th:text="${@uiText.translate(message)}"></p><p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p><details class="fold-form user-create-disclosure"><summary th:text="#{user.create}">Create user</summary><form method="post"><label><span th:text="#{user.username}">Username</span><input name="username" required autocomplete="off"></label><label><span th:text="#{user.fullName}">Full name</span><input name="fullName" required></label><label><span th:text="#{user.password}">Password</span><input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label><span th:text="#{user.role}">Role</span><select name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${role}"></option></select></label><button th:text="#{user.create}">Create user</button></form></details><div class="table-scroll user-table"><table><thead><tr><th th:text="#{user.username}">Username</th><th th:text="#{common.name}">Name</th><th th:text="#{user.role}">Role</th><th th:text="#{common.status}">Status</th><th th:text="#{common.action}">Action</th></tr></thead><tbody><tr th:each="user:${users}"><td th:text="${user.username}"></td><td th:text="${user.fullName}"></td><td><span class="status" th:text="${#messages.msg('role.'+user.role)}"></span></td><td th:text="${user.active?#messages.msg('common.active'):#messages.msg('common.inactive')}"></td><td><form method="post" th:action="@{'/users/'+${user.id}+'/toggle'}"><button th:text="${user.active?#messages.msg('user.deactivate'):#messages.msg('user.activate')}"></button></form></td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="empty" th:text="#{user.empty}">No users found.</td></tr></tbody></table></div></main></section></div></body></html>
