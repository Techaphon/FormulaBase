<!doctype html>
<html th:lang="${#locale.language}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/app.css?v=20261109-ui-readability"><script src="/js/app.js?v=20261105-ui"></script><title th:text="#{transfer.title}">Review tasks before removing account</title></head>
<body class="workspace-page"><div class="fb-shell"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><section class="fb-content"><div th:replace="~{fragments/topbar :: topbar}"></div><main>
<a class="back-link" href="/users" th:text="#{common.back}">Back</a>
<header class="fb-page-heading"><div><h1 th:text="#{transfer.title}">Review tasks</h1><p th:text="#{transfer.description}"></p></div></header>
<p><strong th:text="#{transfer.account}">Account</strong>: <span th:text="${targetUser.fullName+' (@'+targetUser.username+')'}"></span></p>
<p class="hint" th:text="#{transfer.removalNotice}">The account will no longer be able to sign in.</p>
<p class="error" th:if="${error}" th:text="${@uiText.translate(error)}"></p>
<p class="hint" th:if="${not #lists.isEmpty(tasks)}" th:text="#{transfer.note}"></p>
<p th:if="${#lists.isEmpty(tasks)}" th:text="#{transfer.empty}"></p>
<p class="error" th:if="${not #lists.isEmpty(tasks) and #lists.isEmpty(workers)}" th:text="#{transfer.noWorkers}"></p>
<form method="post" th:action="@{'/users/'+${targetUser.id}+'/delete'}">
<input type="hidden" name="_csrf" th:value="${csrfToken}">
<h2 th:if="${not #lists.isEmpty(tasks)}" th:text="#{transfer.count(${#lists.size(tasks)})}"></h2>
<article class="transfer-task" th:each="task:${tasks}">
<strong th:text="${task.formula.name+' · '+task.formula.documentNo}"></strong>
<p><span th:text="#{common.date}">Date</span>: <span th:text="${task.plannedDate}"></span> · <span th:text="#{common.status}">Status</span>: <span th:text="${#messages.msg('status.'+task.status)}"></span> · <span th:text="#{transfer.target}">Target</span>: <span th:text="${task.targetQuantity}"></span></p>
<input type="hidden" th:name="${'version_'+task.id}" th:value="${task.version}">
<label><span th:text="#{transfer.replacement}">Select the next worker</span><select th:name="${'replacement_'+task.id}" required><option value="" th:text="#{transfer.select}">Choose</option><option th:each="worker:${workers}" th:value="${worker.id}" th:text="${worker.fullName+' (@'+worker.username+')'}"></option></select></label>
</article>
<button type="submit" th:disabled="${not #lists.isEmpty(tasks) and #lists.isEmpty(workers)}" th:text="${#lists.isEmpty(tasks) ? #messages.msg('transfer.removeOnly') : #messages.msg('transfer.submit')}">Confirm</button>
<a class="fb-action" href="/users" th:text="#{common.cancel}">Cancel</a>
</form></main></section></div></body></html>
